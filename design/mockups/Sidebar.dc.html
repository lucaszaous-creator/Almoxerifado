<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu lateral — VidaCor</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/853c2170559ca366b1acd78dfcd0297c">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; min-height: 1400px; display: flex; flex-direction: column; gap: 4px; font-family: Inter, sans-serif; background: #F2F3F6; padding: 0 0 8px">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,23,42,.05)">
    <img src="/_blob/eed7655394c1bf2c8efa21875f980287" alt="" style="width: 44px; height: 30px; object-fit: contain">
    <span style="flex: 1; line-height: 1.25"><b style="display: block; font-size: 16px; font-weight: 650; color: #0A1A4A">VidaCor Imagem</b><span style="font-size: 13px; color: #5B6474">Unidade Centro</span></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6474" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
  </a>
  <label class="search" style="margin-top: 10px; background: #FFFFFF">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span class="sr">Buscar</span>
    <input type="search" placeholder="Paciente, CPF, protocolo, placa">
    <span class="kbd">Ctrl K</span>
  </label>

  <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
    <div class="sec">{{sec.title}}</div>
    <sc-for list="{{sec.items}}" as="it" hint-placeholder-count="4">
      <a class="{{it.cls}}" href="{{it.href}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
        {{it.label}}
        <sc-if value="{{it.hasCount}}" hint-placeholder-val="{{ false }}"><span class="ct">{{it.count}}</span></sc-if>
        <sc-if value="{{it.hasAlert}}" hint-placeholder-val="{{ false }}"><span class="al" aria-label="{{it.alertLabel}}">{{it.alert}}</span></sc-if>
      </a>
    </sc-for>
  </sc-for>

  <div class="sec">Nas salas agora</div>
  <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
    <div class="row" style="padding: 6px 8px"><span class="av av-sm" style="background: #E8F2FB; color: #0C72B0">PM</span><span class="t14" style="flex: 1">Dr. Paulo Medeiros</span><span class="t13 mute">Eco · S1</span></div>
    <div class="row" style="padding: 6px 8px"><span class="av av-sm" style="background: #EFEBFC; color: #5B45B5">RA</span><span class="t14" style="flex: 1">Dra. Renata Alves</span><span class="t13 mute">USG · S2</span></div>
    <div class="row" style="padding: 6px 8px"><span class="av av-sm" style="background: #E5F5EC; color: #1F7A4D">MF</span><span class="t14" style="flex: 1">Dr. Marcos Freire</span><span class="t13 mute">Doppler · S3</span></div>
  </div>

  <div style="margin-top: 14px; background: #FFFFFF; border-radius: 18px; padding: 16px; box-shadow: 0 1px 2px rgba(15,23,42,.05)">
    <div class="row" style="gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <b class="t15" style="font-weight: 600">Expediente</b><span class="t14 mute num" style="margin-left: auto">07:00–19:00</span>
    </div>
    <div class="bar" style="margin: 12px 0 10px"><i style="width: 14%"></i></div>
    <div class="row t14 mute"><span>Faltam 10 h 20 min</span><span class="num" style="margin-left: auto">14%</span></div>
  </div>

  <div class="row" style="margin-top: 10px; padding: 8px 8px">
    <span class="av" style="background: #0A1A4A; color: #fff">{{userInitials}}</span>
    <span style="flex: 1; line-height: 1.3"><b class="t15" style="display: block; font-weight: 600">{{userName}}</b><span class="t13 mute">{{userRole}}</span></span>
    <a class="icon-btn" href="Configuracoes.dc.html" aria-label="Configurações da conta" style="width: 40px; height: 40px; border: 0; background: transparent">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","agenda","recepcao","pacientes","atendimento","caixa","sala","laudos","fluxo","visualizador","faturamento","financeiro","estoque","comunicacao","telemedicina","estacionamento","indicadores","configuracoes"],"default":"inicio"},"userName":{"editor":"text","default":"Ana Souza"},"userRole":{"editor":"text","default":"Recepção"},"userInitials":{"editor":"text","default":"AS"},"$preview":{"width":280,"height":1400}}'>

    const it = (key, label, href, extra) => Object.assign({

    const sections = [

      { title: 'Exames', items: [

    return {

  }
}
</script>
</body>
</html>
