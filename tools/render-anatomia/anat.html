<!doctype html><html><head><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const P=new URLSearchParams(location.search);
const W=+P.get('w'),H=+P.get('h'),view=P.get('view')||'full',rot=+(P.get('rot')||0);
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=0.95;r.outputColorSpace=THREE.SRGBColorSpace;r.sortObjects=true;
document.body.appendChild(r.domElement);
const s=new THREE.Scene();const pm=new THREE.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const k=new THREE.DirectionalLight(0xffffff,1.3);k.position.set(1.5,2,3);s.add(k);
const rim=new THREE.DirectionalLight(0xa9cfff,1.1);rim.position.set(-2,1,-2);s.add(rim);
s.add(new THREE.AmbientLight(0xffffff,0.25));
const M={
 skin:new THREE.MeshPhysicalMaterial({color:0xD9A58C,roughness:0.5,sheen:1.0,sheenColor:new THREE.Color(0x9cc7ff),transparent:true,opacity:0.2,depthWrite:false,side:THREE.FrontSide}),
 bone:new THREE.MeshPhysicalMaterial({color:0xE8DEC8,roughness:0.5,clearcoat:0.3,transparent:true,opacity:0.92}),
 cart:new THREE.MeshPhysicalMaterial({color:0xD8E2E6,roughness:0.4,transparent:true,opacity:0.85}),
 heart:new THREE.MeshPhysicalMaterial({color:0xB0242E,roughness:0.35,clearcoat:0.6}),
 lung:new THREE.MeshPhysicalMaterial({color:0xE89A98,roughness:0.55,transparent:true,opacity:0.32,depthWrite:false}),
 airway:new THREE.MeshPhysicalMaterial({color:0xE9CDBD,roughness:0.5}),
 artery:new THREE.MeshPhysicalMaterial({color:0xC2303C,roughness:0.35,clearcoat:0.5}),
 carotid:new THREE.MeshPhysicalMaterial({color:0xC2303C,roughness:0.35,clearcoat:0.5}),
 liver:new THREE.MeshPhysicalMaterial({color:0x8A3428,roughness:0.4,clearcoat:0.4}),
 kidney:new THREE.MeshPhysicalMaterial({color:0x963C30,roughness:0.4,clearcoat:0.4}),
 spleen:new THREE.MeshPhysicalMaterial({color:0x6E2C3E,roughness:0.4}),
 stomach:new THREE.MeshPhysicalMaterial({color:0xD99484,roughness:0.5}),
 gut:new THREE.MeshPhysicalMaterial({color:0xD3A07E,roughness:0.55,transparent:true,opacity:0.9}),
 bladder:new THREE.MeshPhysicalMaterial({color:0xE2B48A,roughness:0.5}),
 brain:new THREE.MeshPhysicalMaterial({color:0xEFCFC4,roughness:0.6})
};
const focus=P.get('focus');
const F={cardio:['heart','artery','carotid'],abdome:['liver','kidney','spleen','stomach','gut','bladder']};
if(focus){for(const[g,m]of Object.entries(M)){if(g==='skin')continue;if(!F[focus].includes(g)){m.transparent=true;m.opacity=Math.min(m.opacity,g==='bone'?0.28:0.18);m.depthWrite=false;}else{m.emissive=new THREE.Color(m.color).multiplyScalar(0.25);}}}
const parts=await (await fetch('./bp_parts.json')).json();
const root=new THREE.Group();root.rotation.x=-Math.PI/2;
const pivot=new THREE.Group();pivot.add(root);pivot.rotation.y=rot;s.add(pivot);
const L=new STLLoader();const boxes={};
await Promise.all(parts.map(async([id,g])=>{const geo=await L.loadAsync('./bp/'+id+'.stl');geo.computeVertexNormals();const m=new THREE.Mesh(geo,M[g]);m.renderOrder=g==='skin'?10:(g==='lung'?5:0);root.add(m);(boxes[g]=boxes[g]||[]).push(m);}));
// center
pivot.updateMatrixWorld(true);
const bb=new THREE.Box3().setFromObject(root);const c=bb.getCenter(new THREE.Vector3());const sz=bb.getSize(new THREE.Vector3());
root.position.x-=0;const sc=1.8/sz.y;pivot.scale.setScalar(sc);
pivot.updateMatrixWorld(true);const bb2=new THREE.Box3().setFromObject(pivot);const c2=bb2.getCenter(new THREE.Vector3());
pivot.position.sub(new THREE.Vector3(c2.x,bb2.min.y,c2.z));pivot.updateMatrixWorld(true);
const cam=new THREE.PerspectiveCamera(view==='busto'?16:22,W/H,0.01,100);
if(view==='busto'){cam.position.set(0,1.36,2.6);cam.lookAt(0,1.3,0);}else if(view==='abdome'){cam.position.set(0,1.08,2.6);cam.lookAt(0,1.05,0);}else{cam.position.set(0,0.95,5.6);cam.lookAt(0,0.9,0);}
const ctr=g=>{const b=new THREE.Box3();(boxes[g]||[]).forEach(m=>b.expandByObject(m));return b.getCenter(new THREE.Vector3())};
const pts={coracao:ctr('heart'),carotida:ctr('carotid'),pulmao:ctr('lung'),figado:ctr('liver'),rim:ctr('kidney'),estomago:ctr('stomach'),bexiga:ctr('bladder'),cerebro:ctr('brain')};
const out={};for(const[kk,v]of Object.entries(pts)){const p=v.clone().project(cam);out[kk]=[Math.round((p.x+1)/2*W),Math.round((1-p.y)/2*H)]}
r.render(s,cam);window.__pts=out;window.__dims=[sz.x,sz.y,sz.z];window.__done=true;
</script></body></html>
